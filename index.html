<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости визиток</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="chosed-blok">
            <h2>Выберите визитки</h2>
            
            <div class="info-panel">
                <p>Элементов выбрано: <span id="count">0</span></p>
                <p>Сумма: <span id="sum">0</span> руб.</p>
            </div>

            <div class="chosed-blok-content">
                <!-- Карточки с ценами в атрибуте data-price -->
                <div class="card-item" data-price="500">
                    <span class="card-title">Классика</span>
                    <span class="card-price">500 ₽</span>
                </div>
                <div class="card-item" data-price="700">
                    <span class="card-title">Минимализм</span>
                    <span class="card-price">700 ₽</span>
                </div>
                <div class="card-item" data-price="1000">
                    <span class="card-title">Стандарт+</span>
                    <span class="card-price">1000 ₽</span>
                </div>
                <div class="card-item" data-price="1500">
                    <span class="card-title">Премиум</span>
                    <span class="card-price">1500 ₽</span>
                </div>
                <div class="card-item" data-price="2000">
                    <span class="card-title">Люкс</span>
                    <span class="card-price">2000 ₽</span>
                </div>
                <div class="card-item" data-price="2500">
                    <span class="card-title">Бизнес</span>
                    <span class="card-price">2500 ₽</span>
                </div>
                <div class="card-item" data-price="3000">
                    <span class="card-title">VIP</span>
                    <span class="card-price">3000 ₽</span>
                </div>
                <div class="card-item" data-price="4000">
                    <span class="card-title">Эксклюзив</span>
                    <span class="card-price">4000 ₽</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
